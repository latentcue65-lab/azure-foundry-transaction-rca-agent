[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphere-rca-agent"
version = "0.1.0"
description = "Evidence-grounded transaction investigation agent for Microsoft Foundry"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-projects>=2.0,<3",
  "azure-identity>=1.20,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
# OneDrive on Windows can reject hardlinks from the package cache.
link-mode = "copy"

[project.scripts]
rca = "rca_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/ARCHITECTURE.md", "/pyproject.toml", "/uv.lock", "/.env.example", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
